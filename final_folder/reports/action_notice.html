<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Action Notice</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f7f9fb;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      margin: auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .header {
      padding: 18px 24px;
      background: linear-gradient(120deg, #2563eb, #0ea5e9);
      color: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .content { padding: 20px 24px 10px; }
    .content p { margin: 0 0 12px; line-height: 1.6; }
    .pill {
      display: inline-block;
      background: #e0f2fe;
      color: #0c4a6e;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      border: 1px solid #bae6fd;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 6px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    th { width: 28%; color: #475569; }
    .footer {
      padding: 14px 24px 20px;
      font-size: 12px;
      color: #64748b;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Action Required</div>
    <div class="content">
      <p><span class="pill">Action</span></p>
      <p>The following action is requested for the specified endpoint.</p>
      <table aria-label="Action details">
        <tr><th scope="row">Action</th><td>Check Status</td></tr>
        <tr><th scope="row">Hostname</th><td>100.80.115.61</td></tr>
        <tr><th scope="row">Port</th><td>8008</td></tr>
        <tr><th scope="row">Generated (UTC)</th><td>2025-11-25 09:25:43Z</td></tr>
      </table>
    </div>
    <div class="footer">This message was auto-generated for notification purposes.</div>
  </div>
</body>
</html>
