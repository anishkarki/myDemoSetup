<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSearch DSL Generator & Log Fetcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #666; font-weight: 600; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
        input[type="text"]:focus, select:focus { border-color: #007bff; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; font-weight: 600; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #545b62; }
        .result-area { margin-top: 30px; background: #f8f9fa; padding: 20px; border-radius: 4px; border: 1px solid #e9ecef; display: none; }
        pre { white-space: pre-wrap; word-wrap: break-word; color: #212529; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Log Fetcher UI</h1>
        <form id="dslForm" method="POST">
            <div class="form-group">
                <label for="host">Hostname</label>
                <input type="text" id="host" name="host" placeholder="e.g., patroni1" required>
            </div>
            <div class="form-group">
                <label for="keywords">Keywords (comma separated)</label>
                <input type="text" id="keywords" name="keywords" placeholder="e.g., error, fail, exception" value="error, fail, exception">
            </div>
            <div class="form-group">
                <label for="exclude_keywords">Exclude Keywords (comma separated)</label>
                <input type="text" id="exclude_keywords" name="exclude_keywords" placeholder="e.g., debug, info">
            </div>
            <div class="form-group">
                <label for="index">Index Pattern</label>
                <input type="text" id="index" name="index" value="patronidata">
            </div>
            <div class="form-group">
                <label for="time_range">Time Range</label>
                <select id="time_range" name="time_range">
                    <option value="15m">Last 15 Minutes</option>
                    <option value="1h" selected>Last 1 Hour</option>
                    <option value="24h">Last 24 Hours</option>
                    <option value="7d">Last 7 Days</option>
                </select>
            </div>
            <div class="form-group">
                <label for="output_format">Output Format</label>
                <select id="output_format" name="output_format">
                    <option value="html" selected>HTML Report</option>
                    <option value="log">Plain Log File</option>
                </select>
            </div>
            
            <div class="btn-group">
                <button type="submit" name="action" value="generate_dsl" class="btn-secondary">Generate DSL</button>
                <button type="submit" name="action" value="fetch_logs" class="btn-primary">Fetch & Report</button>
            </div>
        </form>

        {% if result %}
        <div class="result-area" style="display: block;">
            <h3>Result:</h3>
            {% if result_type == 'dsl' %}
                <pre>{{ result | tojson(indent=4) }}</pre>
            {% elif result_type == 'report' %}
                <p>Report generated successfully!</p>
                <p>Found <strong>{{ hit_count }}</strong> logs.</p>
                <a href="/download_report" target="_blank" class="btn-primary" style="display:inline-block; text-decoration:none; text-align:center; width:auto; padding: 10px 20px;">Download Report</a>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
