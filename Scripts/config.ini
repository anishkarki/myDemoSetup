[general]
output_dir = monitors
mapping_file = 

[monitor:fatal_panic]
name = Postgres FATAL/PANIC Alert
monitor_type = query_level_monitor
indices = postgres*
interval = 1
interval_unit = MINUTES
window = 1m
match_field = _raw
match_value = FATAL|PANIC
match_type = regex_or
host_pattern = 87b4cc23*
host_field = host.name
threshold = 1
severity = 1
destination_id = your_webhook_config_id
sample_size = 3

[monitor:error_5min]
name = Postgres High ERROR Count (5 min)
monitor_type = query_level_monitor
indices = postgres*
interval = 5
interval_unit = MINUTES
window = 5m
match_field = _raw
match_value = ERROR:
match_type = match
threshold = 2
severity = 2
destination_id = your_webhook_config_id
by_host = true
top_errors_size = 2
sample_size = 3
