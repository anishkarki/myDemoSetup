[general]
output_dir = monitors
mapping_file = 

[monitor:fatal_panic_highest]
name = PostgreSQL FATAL/PANIC - Highest Severity (Database Dropped, Corruption, System Errors)
monitor_type = query_level_monitor
indices = postgres*,postgresql*,postgres-logs*
interval = 1
interval_unit = MINUTES
window = 1m
use_structured_code = true
match_field = error.code
# Use shorthand to select the precomputed 'highest' SQLSTATE regex
match_value = highest
match_type = regex
host_pattern = *
host_field = host.keyword
threshold = 1
severity = 1
destination_id = your_webhook_config_id
by_host = false
sample_size = 5
throttle_enabled = true
throttle_duration_minutes = 10

[monitor:error_medium]
name = PostgreSQL ERROR - Medium Severity (Constraints, Deadlock)
monitor_type = query_level_monitor
indices = postgres*,postgresql*,postgres-logs*
interval = 5
interval_unit = MINUTES
window = 5m
use_structured_code = true
match_field = error.code
match_value = medium
host_field = host.keyword
host_pattern = *
threshold = 2
severity = 2
destination_id = your_webhook_config_id
by_host = true
per_host_threshold = 5
sample_size_per_host = 50
by_host_size = 10
top_errors_size = 3
throttle_enabled = true
throttle_duration_minutes = 10

[monitor:error_normal]
name = PostgreSQL ERROR - Normal (Data Exceptions, Syntax, etc)
monitor_type = query_level_monitor
indices = postgres*,postgresql*,postgres-logs*
interval = 10
interval_unit = MINUTES
window = 10m
use_structured_code = true
match_field = error.code
match_value = normal
host_field = host.keyword
host_pattern = *
threshold = 2
severity = 3
destination_id = your_webhook_config_id
by_host = true
per_host_threshold = 10
sample_size_per_host = 50
by_host_size = 10
top_errors_size = 3
throttle_enabled = true
throttle_duration_minutes = 20
