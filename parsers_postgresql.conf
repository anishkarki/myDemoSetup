[PARSER]
    Name        postgres_log
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?)\s+\[(?<pid>\d+)\]\s+(?<level>[A-Z]+):\s+(?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S %Z
    Time_Keep On
    Types pid:integer

[MULTILINE_PARSER]
    Name          postgres_multiline
    Type          regex
    Flush_Timeout 1000
    Rule "start_state"   "/^\d{4}-\d{2}-\d{2}/"  "cont"
    Rule "cont"          "/^\s+/"                "cont"